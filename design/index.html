<script type="text/babel">
const {useState,useEffect,useCallback}=React;

/* ═══════════════ DATA ═══════════════ */
const ZONE_DATA={"제1종전용주거지역":{건폐율:50,용적률:100,높이제한:10,일조권:true,인접도로:4,전면이격:1.5,측면이격:0.5,color:"#5B8C5A",label:"1종전용"},"제2종전용주거지역":{건폐율:50,용적률:150,높이제한:12,일조권:true,인접도로:4,전면이격:1.5,측면이격:0.5,color:"#6B9E6A",label:"2종전용"},"제1종일반주거지역":{건폐율:60,용적률:200,높이제한:16,일조권:true,인접도로:6,전면이격:1.5,측면이격:0.5,color:"#C4923E",label:"1종일반"},"제2종일반주거지역":{건폐율:60,용적률:250,높이제한:20,일조권:true,인접도로:6,전면이격:2.0,측면이격:0.5,color:"#B8862E",label:"2종일반"},"제3종일반주거지역":{건폐율:50,용적률:300,높이제한:null,일조권:true,인접도로:8,전면이격:2.0,측면이격:1.0,color:"#A8834F",label:"3종일반"},"준주거지역":{건폐율:70,용적률:500,높이제한:null,일조권:false,인접도로:8,전면이격:2.0,측면이격:1.0,color:"#D4A76A",label:"준주거"},"중심상업지역":{건폐율:90,용적률:1500,높이제한:null,일조권:false,인접도로:12,전면이격:3.0,측면이격:0,color:"#B55454",label:"중심상업"},"일반상업지역":{건폐율:80,용적률:1300,높이제한:null,일조권:false,인접도로:10,전면이격:2.5,측면이격:0,color:"#C76868",label:"일반상업"},"근린상업지역":{건폐율:70,용적률:900,높이제한:null,일조권:false,인접도로:8,전면이격:2.0,측면이격:0,color:"#D48A8A",label:"근린상업"},"유통상업지역":{건폐율:80,용적률:1100,높이제한:null,일조권:false,인접도로:10,전면이격:2.5,측면이격:0,color:"#C97878",label:"유통상업"},"전용공업지역":{건폐율:70,용적률:300,높이제한:null,일조권:false,인접도로:8,전면이격:2.0,측면이격:1.0,color:"#7A8B9E",label:"전용공업"},"일반공업지역":{건폐율:70,용적률:350,높이제한:null,일조권:false,인접도로:8,전면이격:2.0,측면이격:1.0,color:"#8E9DAE",label:"일반공업"},"준공업지역":{건폐율:70,용적률:400,높이제한:null,일조권:false,인접도로:8,전면이격:2.0,측면이격:1.0,color:"#A2AFBE",label:"준공업"},"보전녹지지역":{건폐율:20,용적률:80,높이제한:10,일조권:false,인접도로:4,전면이격:3.0,측면이격:1.5,color:"#5B8C5A",label:"보전녹지"},"생산녹지지역":{건폐율:20,용적률:100,높이제한:10,일조권:false,인접도로:4,전면이격:3.0,측면이격:1.5,color:"#4A7D49",label:"생산녹지"},"자연녹지지역":{건폐율:20,용적률:100,높이제한:10,일조권:false,인접도로:4,전면이격:3.0,측면이격:1.5,color:"#3D6E3C",label:"자연녹지"}};

const BUILDING_USES={"단독주택":{주차면적기준:150,조경면적비율:0},"다가구주택":{주차면적기준:100,조경면적비율:0},"다세대주택":{주차면적기준:85,조경면적비율:5},"연립주택":{주차면적기준:85,조경면적비율:10},"아파트":{주차면적기준:75,조경면적비율:15},"제1종근린생활시설":{주차면적기준:134,조경면적비율:5},"제2종근린생활시설":{주차면적기준:134,조경면적비율:5},"업무시설":{주차면적기준:100,조경면적비율:10},"숙박시설":{주차면적기준:100,조경면적비율:10},"판매시설":{주차면적기준:134,조경면적비율:5}};

const SAMPLE_LOTS=[{address:"서울특별시 강남구 역삼동 123-4",지목:"대",면적:330.5,용도지역:"제2종일반주거지역",도로폭:8,대지형상:"정형",경사도:2,방위:"남향",지구단위:false},{address:"서울특별시 서초구 서초동 456-7",지목:"대",면적:520.0,용도지역:"제3종일반주거지역",도로폭:12,대지형상:"정형",경사도:1,방위:"남동향",지구단위:false},{address:"서울특별시 종로구 삼청동 78-2",지목:"대",면적:198.3,용도지역:"제1종일반주거지역",도로폭:6,대지형상:"부정형",경사도:5,방위:"동향",지구단위:true},{address:"서울특별시 마포구 연남동 234-1",지목:"대",면적:264.8,용도지역:"제2종일반주거지역",도로폭:6,대지형상:"정형",경사도:0,방위:"남향",지구단위:false},{address:"서울특별시 용산구 이태원동 89-3",지목:"대",면적:412.6,용도지역:"준주거지역",도로폭:10,대지형상:"정형",경사도:8,방위:"남서향",지구단위:false},{address:"서울특별시 송파구 잠실동 45-6",지목:"대",면적:680.0,용도지역:"일반상업지역",도로폭:25,대지형상:"정형",경사도:0,방위:"남향",지구단위:true},{address:"서울특별시 강북구 미아동 112-8",지목:"대",면적:215.3,용도지역:"제1종일반주거지역",도로폭:4,대지형상:"부정형",경사도:12,방위:"북향",지구단위:false},{address:"서울특별시 영등포구 여의도동 33-1",지목:"대",면적:1250.0,용도지역:"중심상업지역",도로폭:35,대지형상:"정형",경사도:0,방위:"남향",지구단위:true},{address:"서울특별시 성동구 성수동 567-2",지목:"대",면적:380.0,용도지역:"준공업지역",도로폭:8,대지형상:"정형",경사도:1,방위:"서향",지구단위:false},{address:"경기도 성남시 분당구 정자동 890-1",지목:"대",면적:450.0,용도지역:"제2종일반주거지역",도로폭:10,대지형상:"정형",경사도:3,방위:"남향",지구단위:false},{address:"인천광역시 연수구 송도동 12-34",지목:"대",면적:850.0,용도지역:"일반상업지역",도로폭:20,대지형상:"정형",경사도:0,방위:"남향",지구단위:true},{address:"부산광역시 해운대구 우동 567-8",지목:"대",면적:600.0,용도지역:"준주거지역",도로폭:15,대지형상:"정형",경사도:2,방위:"남동향",지구단위:false}];

/* ═══════════════ CALC ═══════════════ */
function calcBldg(lot,use){const z=ZONE_DATA[lot.용도지역],u=BUILDING_USES[use];if(!z||!u)return null;const A=lot.면적,br=z.건폐율,fr=z.용적률;const ba=Math.floor(A*(br/100)*10)/10,fa=Math.floor(A*(fr/100)*10)/10;const fh=3.3;const mf=z.높이제한?Math.floor(z.높이제한/fh):Math.floor(fa/ba);const af=Math.min(mf,Math.ceil(fa/ba));let sh=null;if(z.일조권)sh=9+(lot.도로폭/2)*0.5+(A>200?3:0);const pk=Math.ceil(ba*af/u.주차면적기준),pa=pk*12.5;const la=A*(u.조경면적비율/100);const w=Math.sqrt(A*1.2),d=A/w;const ew=Math.max(w-z.측면이격*2,3),ed=Math.max(d-z.전면이격-z.측면이격,3);const rsh=lot.도로폭*1.5;const mh=Math.min(...[af*fh,rsh,sh].filter(v=>v!==null&&v>0));const ff=Math.min(af,Math.floor(mh/fh));const tfa=ba*ff,tfr=Math.round((tfa/A)*100*10)/10;return{대지면적:A,건폐율:br,용적률:fr,건축면적:ba,연면적:tfa,법정연면적:fa,실제층수:ff,최대층수:mf,건물높이:ff*fh,최대높이:z.높이제한,도로사선높이:rsh,일조권높이:sh,주차대수:pk,주차면적:pa,조경면적:la,전면이격:z.전면이격,측면이격:z.측면이격,유효가로:ew,유효세로:ed,최종용적률:tfr,도로폭:lot.도로폭,zone:z}}

/* ═══════════════ COMPONENTS ═══════════════ */

/* Section Label with gold line */
function SLabel({text}){return(<div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}><div style={{width:84,height:2,background:"var(--gold-line)",position:"relative"}}><div style={{position:"absolute",left:0,top:-2,width:6,height:6,borderRadius:"50%",background:"var(--gold)"}}/></div><span style={{fontFamily:"var(--latin)",fontSize:12,color:"var(--muted)",letterSpacing:"0.15em",textTransform:"uppercase",fontWeight:400}}>{text}</span></div>)}

/* 3D Building Visualization */
function BViz({result}){if(!result)return null;const w=360,h=320,s=1.8,ox=w/2,oy=h-60;const iso=(x,y,z)=>({x:ox+(x-y)*0.866*s,y:oy-(x+y)*0.5*s-z*s});const gw=Math.min(result.유효가로,40),gd=Math.min(result.유효세로,30),nf=result.실제층수;const g1=iso(-gw/2-5,-gd/2-5,0),g2=iso(gw/2+5,-gd/2-5,0),g3=iso(gw/2+5,gd/2+5,0),g4=iso(-gw/2-5,gd/2+5,0);const gp=`M${g1.x},${g1.y} L${g2.x},${g2.y} L${g3.x},${g3.y} L${g4.x},${g4.y}Z`;const fl=[];for(let i=0;i<nf;i++){const z1=(i+1)*3.3,z0=i*3.3;const t1=iso(-gw/2,-gd/2,z1),t2=iso(gw/2,-gd/2,z1),t3=iso(gw/2,gd/2,z1),t4=iso(-gw/2,gd/2,z1);const r1=iso(gw/2,-gd/2,z0),r2=iso(gw/2,gd/2,z0),l1=iso(-gw/2,gd/2,z0);fl.push({i,tp:`M${t1.x},${t1.y} L${t2.x},${t2.y} L${t3.x},${t3.y} L${t4.x},${t4.y}Z`,rp:`M${t2.x},${t2.y} L${t3.x},${t3.y} L${r2.x},${r2.y} L${r1.x},${r1.y}Z`,lp:`M${t3.x},${t3.y} L${t4.x},${t4.y} L${l1.x},${l1.y} L${r2.x},${r2.y}Z`})}const c=result.zone.color;return(<svg viewBox={`0 0 ${w} ${h}`} style={{width:"100%",height:"auto"}}><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="var(--dark)"/><stop offset="100%" stopColor="#3A3734"/></linearGradient></defs><rect width={w} height={h} fill="url(#sg)" rx="12"/><path d={gp} fill="#4A4741" stroke="#5A5650" strokeWidth="0.5" opacity="0.5"/>{fl.map(f=>{const a=0.6+(f.i/nf)*0.4;return(<g key={f.i}><path d={f.rp} fill={c} opacity={a*0.5} stroke="rgba(255,255,255,0.08)" strokeWidth="0.3"/><path d={f.lp} fill={c} opacity={a*0.35} stroke="rgba(255,255,255,0.08)" strokeWidth="0.3"/><path d={f.tp} fill={c} opacity={a*0.7} stroke="rgba(255,255,255,0.12)" strokeWidth="0.3"/>{Array.from({length:Math.min(Math.floor(gw/5),6)}).map((_,wi)=>{const fr=(wi+1)/(Math.min(Math.floor(gw/5),6)+1);const pt=iso(-gw/2+gw*fr,-gd/2+0.2,f.i*3.3+1.8);return <circle key={wi} cx={pt.x} cy={pt.y} r="1.2" fill="#fff" opacity="0.4"/>})}</g>)})}<text x={w-20} y={30} fill="var(--gold-lt)" fontSize="9" textAnchor="end" fontFamily="var(--mono)">{result.건물높이.toFixed(1)}m</text><text x={w-20} y={42} fill="var(--muted)" fontSize="7" textAnchor="end" fontFamily="var(--mono)">{result.실제층수}F</text><rect x="10" y="10" width="60" height="20" rx="4" fill={c} opacity="0.25"/><text x="40" y="23" fill={c} fontSize="8" textAnchor="middle" fontWeight="bold" fontFamily="var(--sans)">{result.zone.label}</text></svg>)}

/* Gauge Chart */
function Gauge({value,max,label,unit="%",color}){const pct=Math.min((value/max)*100,100);return(<div style={{textAlign:"center"}}><div style={{position:"relative",width:76,height:76,margin:"0 auto"}}><svg viewBox="0 0 36 36" style={{width:"100%",height:"100%",transform:"rotate(-90deg)"}}><circle cx="18" cy="18" r="15.5" fill="none" stroke="var(--line)" strokeWidth="2.5"/><circle cx="18" cy="18" r="15.5" fill="none" stroke={color||"var(--gold)"} strokeWidth="2.5" strokeDasharray={`${pct} ${100-pct}`} strokeLinecap="round" style={{transition:"stroke-dasharray 1s ease"}}/></svg><div style={{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)",fontSize:14,fontWeight:700,color:"var(--ink)",fontFamily:"var(--mono)"}}>{value.toFixed(0)}<span style={{fontSize:8,color:"var(--muted)"}}>{unit}</span></div></div><div style={{fontSize:11,color:"var(--muted)",marginTop:6,fontFamily:"var(--latin)",letterSpacing:"0.05em"}}>{label}</div></div>)}

/* Stat Card */
function Stat({label,value,sub,accent}){return(<div style={{padding:"14px 16px",background:"var(--card)",borderRadius:12,border:"1px solid var(--line)",boxShadow:"0 1px 4px rgba(0,0,0,0.03)"}}><div style={{fontFamily:"var(--latin)",fontSize:10,color:"var(--muted)",marginBottom:6,letterSpacing:"0.12em",textTransform:"uppercase"}}>{label}</div><div style={{fontSize:20,fontWeight:700,color:accent||"var(--ink)",fontFamily:"var(--mono)"}}>{value}</div>{sub&&<div style={{fontSize:11,color:"var(--muted)",marginTop:3}}>{sub}</div>}</div>)}

/* Regulation Check */

/* ═══════════════ MAIN APP ═══════════════ */
function App(){
const[q,setQ]=useState("");const[sg,setSg]=useState([]);const[lot,setLot]=useState(null);const[use,setUse]=useState("다세대주택");const[res,setRes]=useState(null);const[show,setShow]=useState(false);const[tab,setTab]=useState("overview");const[loading,setLoading]=useState(false);
useEffect(()=>{q.length>=2?setSg(SAMPLE_LOTS.filter(l=>l.address.includes(q))):setSg([])},[q]);
const sel=useCallback(l=>{setLot(l);setQ(l.address);setSg([]);setShow(false);setRes(null)},[]);
const run=useCallback(()=>{if(!lot)return;setLoading(true);setTimeout(()=>{setRes(calcBldg(lot,use));setShow(true);setLoading(false)},1200)},[lot,use]);
const regs=res?[{label:"건폐율 검토",status:"pass",detail:`${(res.건축면적/res.대지면적*100).toFixed(1)}% ≤ ${res.건폐율}% (적합)`},{label:"용적률 검토",status:res.최종용적률<=res.용적률?"pass":"fail",detail:`${res.최종용적률}% ≤ ${res.용적률}% ${res.최종용적률<=res.용적률?"(적합)":"(초과)"}`},{label:"도로사선 제한",status:res.건물높이<=res.도로사선높이?"pass":"warn",detail:`건물높이 ${res.건물높이.toFixed(1)}m / 도로사선 ${res.도로사선높이.toFixed(1)}m`},{label:"일조권 사선제한",status:!res.일조권높이?"pass":res.건물높이<=res.일조권높이?"pass":"warn",detail:res.일조권높이?`높이 ${res.건물높이.toFixed(1)}m / 일조권 ${res.일조권높이.toFixed(1)}m`:"해당없음"},{label:"전면 이격거리",status:"pass",detail:`${res.전면이격}m 이상 확보`},{label:"측면 이격거리",status:"pass",detail:`${res.측면이격}m 이상 확보`},{label:"주차대수 확보",status:"pass",detail:`법정 ${res.주차대수}대 (연면적 기준)`},{label:"접도 요건",status:res.도로폭>=res.zone.인접도로?"pass":"fail",detail:`전면도로 ${res.도로폭}m / 필요 ${res.zone.인접도로}m`}]:[];

return(<div style={{minHeight:"100vh",background:"var(--bg)"}}>
{/* ── HEADER ── */}
<header style={{background:"var(--bar)",borderBottom:"1px solid var(--line)",padding:"14px 20px"}}>
<div style={{maxWidth:960,margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
  <div style={{display:"flex",alignItems:"center",gap:14}}>
    <Logo h={22}/>
    <div style={{width:1,height:20,background:"var(--line)"}}/>
    <span style={{fontFamily:"var(--head)",fontSize:15,fontWeight:600,color:"var(--ink)",letterSpacing:"-0.02em"}}>신축규모검토</span>
  </div>
  <a href="tel:02-6404-4286" style={{display:"flex",alignItems:"center",gap:6,padding:"8px 16px",background:"var(--gold)",color:"#fff",borderRadius:8,fontSize:12,fontWeight:600,textDecoration:"none",fontFamily:"var(--sans)",minHeight:36}}>
    <span style={{fontSize:14}}>📞</span>
    <span className="hide-mobile">상담 문의</span>
  </a>
</div>
</header>

<main style={{maxWidth:960,margin:"0 auto",padding:"24px 20px"}}>

{/* ── SEARCH ── */}
<div className="fade-in" style={{background:"var(--card)",borderRadius:16,padding:24,marginBottom:20,border:"1px solid var(--line)",boxShadow:"0 2px 12px rgba(0,0,0,0.04)"}}>
<SLabel text="Site Search"/>
<div style={{position:"relative"}}>
<input value={q} onChange={e=>{setQ(e.target.value);setLot(null);setShow(false)}} placeholder="주소를 입력하세요 (예: 강남구, 서초동, 역삼동...)" style={{width:"100%",padding:"14px 18px",fontSize:15,background:"var(--bar)",border:"1px solid var(--line)",borderRadius:10,color:"var(--ink)",outline:"none",boxSizing:"border-box",fontFamily:"var(--sans)",transition:"border-color .2s"}} onFocus={e=>{e.target.style.borderColor="var(--gold)";q.length>=2&&setSg(SAMPLE_LOTS.filter(l=>l.address.includes(q)))}} onBlur={e=>e.target.style.borderColor="var(--line)"}/>
{sg.length>0&&<div style={{position:"absolute",top:"100%",left:0,right:0,zIndex:50,background:"var(--card)",border:"1px solid var(--line)",borderRadius:12,marginTop:4,overflow:"hidden",boxShadow:"0 8px 32px rgba(0,0,0,0.08)",maxHeight:"40vh",overflowY:"auto",WebkitOverflowScrolling:"touch"}}>
{sg.map((l,i)=><div key={i} onClick={()=>sel(l)} style={{padding:"12px 16px",cursor:"pointer",borderBottom:i<sg.length-1?"1px solid var(--line)":"none"}} onMouseEnter={e=>e.currentTarget.style.background="var(--bar)"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}><div style={{fontSize:14,color:"var(--ink)",fontWeight:500}}>{l.address}</div><div style={{fontSize:11,color:"var(--muted)",marginTop:3}}>{l.용도지역} · {l.면적}㎡ · {l.지목}</div></div>)}
</div>}</div>
{lot&&<div style={{display:"flex",gap:10,marginTop:14,alignItems:"center",flexWrap:"wrap"}}>
<select value={use} onChange={e=>{setUse(e.target.value);setShow(false)}} style={{padding:"12px 16px",fontSize:14,background:"var(--bar)",border:"1px solid var(--line)",borderRadius:10,color:"var(--ink)",outline:"none",fontFamily:"var(--sans)",flex:1,minWidth:160,minHeight:44,cursor:"pointer"}}>{Object.keys(BUILDING_USES).map(u=><option key={u} value={u}>{u}</option>)}</select>
<button onClick={run} disabled={loading} style={{padding:"12px 28px",fontSize:14,fontWeight:600,background:loading?"var(--line)":"var(--gold)",border:"none",borderRadius:10,color:"#fff",cursor:loading?"wait":"pointer",fontFamily:"var(--sans)",minHeight:44,transition:"background .2s",letterSpacing:"-0.02em"}} onMouseEnter={e=>{if(!loading)e.target.style.background="var(--gold-lt)"}} onMouseLeave={e=>{if(!loading)e.target.style.background="var(--gold)"}}>{loading?"분석 중...":"⚡ 규모검토 실행"}</button></div>}

{/* 법규 띠 */}
<div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:0,marginTop:16,background:"var(--bar)",borderRadius:10,padding:"10px 0",flexWrap:"nowrap",overflow:"hidden"}}>
{["국토계획법","건축법","주차장법","서울시 조례"].map((t,i)=><React.Fragment key={t}>{i>0&&<div style={{width:1,height:14,background:"var(--gold-line)",flexShrink:0}}/>}<span style={{padding:"0 16px",fontSize:11,color:"var(--muted)",whiteSpace:"nowrap",fontFamily:"var(--latin)",letterSpacing:"0.05em"}}>{t}</span></React.Fragment>)}
</div>
</div>

{/* ── LOT INFO ── */}
{lot&&!show&&!loading&&<div className="fade-in" style={{background:"var(--card)",borderRadius:16,padding:24,border:"1px solid var(--line)",marginBottom:20,boxShadow:"0 2px 12px rgba(0,0,0,0.04)"}}>
<SLabel text="Land Information"/>
<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10}}>
<Stat label="대지면적" value={`${lot.면적}㎡`} sub={`≒ ${(lot.면적/3.3058).toFixed(0)}평`}/>
<Stat label="용도지역" value={ZONE_DATA[lot.용도지역]?.label} accent={ZONE_DATA[lot.용도지역]?.color}/>
<Stat label="지목" value={lot.지목}/>
<Stat label="전면도로" value={`${lot.도로폭}m`}/>
<Stat label="대지형상" value={lot.대지형상}/>
<Stat label="방위" value={lot.방위}/>
</div></div>}

{/* ── LOADING ── */}
{loading&&<div className="fade-in" style={{textAlign:"center",padding:60,background:"var(--card)",borderRadius:16,border:"1px solid var(--line)",boxShadow:"0 2px 12px rgba(0,0,0,0.04)"}}><div style={{width:44,height:44,margin:"0 auto 16px",border:"2.5px solid var(--line)",borderTop:"2.5px solid var(--gold)",borderRadius:"50%",animation:"spin 1s linear infinite"}}/><div style={{fontSize:15,color:"var(--ink)",fontWeight:500}}>건축법규 분석 중...</div><div style={{fontSize:12,color:"var(--muted)",marginTop:6}}>용도지역 · 건폐율 · 용적률 · 높이제한 · 일조권 · 도로사선 검토</div></div>}

{/* ── RESULTS ── */}
{show&&res&&<div className="fade-in">
{/* Tabs */}
<div style={{display:"flex",gap:2,marginBottom:18,background:"var(--bar)",borderRadius:12,padding:3,border:"1px solid var(--line)"}}>
{[{id:"overview",l:"📊 개요"},{id:"regulation",l:"📋 법규검토"},{id:"detail",l:"📐 상세수치"}].map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:"11px 0",fontSize:13,fontWeight:tab===t.id?600:400,background:tab===t.id?"var(--card)":"transparent",border:"none",borderRadius:9,color:tab===t.id?"var(--ink)":"var(--muted)",cursor:"pointer",fontFamily:"var(--sans)",transition:"all .2s",boxShadow:tab===t.id?"0 1px 3px rgba(0,0,0,0.06)":"none",borderBottom:tab===t.id?"2px solid var(--gold)":"2px solid transparent",minHeight:44}}>{t.l}</button>)}</div>

{/* Overview Tab */}
{tab==="overview"&&<div style={{display:"flex",flexDirection:"column",gap:16}}>
<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))",gap:16}}>
<div style={{background:"var(--card)",borderRadius:16,padding:20,border:"1px solid var(--line)",boxShadow:"0 2px 12px rgba(0,0,0,0.04)"}}><SLabel text="Building Mass"/><BViz result={res}/></div>
<div style={{background:"var(--card)",borderRadius:16,padding:20,border:"1px solid var(--line)",display:"flex",flexDirection:"column",justifyContent:"center",boxShadow:"0 2px 12px rgba(0,0,0,0.04)"}}><SLabel text="Regulation Limit"/><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20,padding:"10px 0"}}><Gauge value={(res.건축면적/res.대지면적)*100} max={res.건폐율} label="건폐율" color="var(--pass)"/><Gauge value={res.최종용적률} max={res.용적률} label="용적률" color="var(--gold)"/><Gauge value={res.실제층수} max={res.최대층수||res.실제층수} label="층수" unit="F" color="var(--warn)"/><Gauge value={res.건물높이} max={Math.max(res.도로사선높이,res.건물높이)} label="높이" unit="m" color="#7A8B9E"/></div></div></div>

<Stat label="연면적" value={`${res.연면적.toFixed(1)}㎡`} sub={`용적률 ${res.최종용적률}%`} accent="var(--gold)"/>

<Stat label="주차" value={`${res.주차대수}대`} sub={`주차면적 ${res.주차면적.toFixed(0)}㎡`} accent="#7A8B9E"/>
<Stat label="조경면적" value={`${res.조경면적.toFixed(1)}㎡`} sub={`대지 대비 ${(res.조경면적/res.대지면적*100).toFixed(1)}%`}/>

</div></div>}

{/* Regulation Tab */}
{tab==="regulation"&&<div style={{background:"var(--card)",borderRadius:16,padding:24,border:"1px solid var(--line)",boxShadow:"0 2px 12px rgba(0,0,0,0.04)"}}>

<div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}><span style={{fontSize:13}}>📌</span><span style={{fontFamily:"var(--latin)",fontSize:12,color:"var(--muted)",letterSpacing:"0.1em",textTransform:"uppercase"}}>적용 법규 요약</span></div>
<div style={{fontSize:12,color:"var(--muted)",lineHeight:2}}>• 국토의 계획 및 이용에 관한 법률 제77조 (건폐율), 제78조 (용적률)<br/>• 건축법 제58조 (대지 안의 공지), 제61조 (일조 등의 확보를 위한 건축물의 높이 제한)<br/>• 건축법 시행령 제80조 (건축물의 높이 제한), 제86조 (일조권)<br/>• 서울특별시 건축조례 제29조~35조 (용도지역별 건폐율·용적률)<br/>• 주차장법 시행령 제6조 (부설주차장 설치기준)<br/>{lot.지구단위&&"• 지구단위계획 수립지역 – 별도 세부기준 확인 필요"}</div></div></div>}
